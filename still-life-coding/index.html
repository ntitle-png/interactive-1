<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS 静物画 - 秋日餐桌</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>


  <div class="scene">


    <div class="wall"></div>
    <div class="back-table"></div>
    <div class="table"></div>


    <div class="cloth"></div>


    <div class="bottle">
      <div class="bottle-neck"></div>
      <div class="flower-stem stem-1"></div>
      <div class="flower-stem stem-2"></div>
      <div class="flower-stem stem-3"></div>
      <div class="flower-dot dot-1"></div>
      <div class="flower-dot dot-2"></div>
      <div class="flower-dot dot-3"></div>
    </div>

  
    <div class="candle-holder">
      <div class="holder-dish"></div>
      <div class="holder-cup"></div>
    </div>
    <div class="candle">
      <div class="flame"></div>
    </div>
    <div class="ring"></div>


    <div class="gourd-tan"></div>
    <div class="pumpkin">
      <div class="pumpkin-stem"></div>
    </div>
    <div class="squash-yellow"></div>

  </div>

</body>
</html>
