<title>Afterschool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap">
<style>
/* Layout: a terminal. Text column alone at first; a viewport opens beside it as the archive's fidelity rises. Single deliberate dark look. */
:root{
  --bg:#0c0e0d;        /* institutional dark, faint green */
  --panel:#141716;
  --ink:#d6dacd;       /* fluorescent paper */
  --dim:#7a8175;
  --faint:#3a403b;
  --voice:#a8c3bf;     /* the ghost friend speaks in this */
  --fxo:1;
  --exit:#e0473b;      /* EXIT-sign red, the one accent */
  --mono:"Fragment Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;box-sizing:border-box;overflow:hidden}
#app{height:100%;max-width:1240px;margin:0 auto;display:flex;gap:28px}
#viewwrap{flex:0 0 0;min-width:0;overflow:hidden;transition:flex-basis 1.4s cubic-bezier(.6,0,.2,1);container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
#app.open #viewwrap{flex-basis:44%}
#view{position:relative;width:min(100cqw,calc((100cqh - 30px)*.75));aspect-ratio:3/4;background:#050606;overflow:hidden;outline:1px solid var(--faint);transition:filter .8s}
#view.dark{filter:brightness(.28) contrast(1.2)}
#ascii{position:absolute;left:0;top:0;margin:0;font-family:var(--mono);font-size:10px;line-height:1;letter-spacing:0;color:var(--ink);white-space:pre;transform-origin:0 0}
#pix{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#gl{position:absolute;inset:0;cursor:grab}
#gl canvas{display:block;width:100%!important;height:100%!important}
#view::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#cap{font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;text-align:center;min-height:16px;width:min(100cqw,calc((100cqh - 30px)*.75))}

#term{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;max-width:72ch;margin:0 auto}
#app.open #term{margin:0}
#bar{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  border-bottom:1px solid var(--faint);padding-bottom:8px}
#bar .where{color:var(--ink);margin-right:auto}
#bar button{font:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:1px solid var(--faint);color:var(--dim);padding:3px 8px;cursor:pointer}
#bar button:hover{color:var(--ink);border-color:var(--dim)}
#fid b{color:var(--exit);font-weight:400}
#log{flex:1;min-height:0;overflow-y:auto;padding:14px 2px 18px;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
#log > div{margin:0 0 .85em;white-space:pre-wrap;overflow-wrap:anywhere}
.room{color:var(--ink);letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-top:1.6em!important;border-top:1px dashed var(--faint);padding-top:1em}
.fx{color:var(--voice);padding-left:2ch;border-left:2px solid var(--voice);opacity:var(--fxo);transition:opacity 3s}
.fx::before{content:var(--fxl);font-size:10px;letter-spacing:.14em;color:var(--dim)}
body{--fxl:"SOMEONE  "}
body[data-st="1"]{--fxo:.8;--fxl:"A FRIEND?  "}
body[data-st="2"]{--fxo:.6;--fxl:"FRIEND  "}
body[data-st="3"]{--fxo:.38;--fxl:"LAST SEEN MAY 2027  "}
.savebox{border:1px solid var(--faint);padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.savebox .u{font-size:13px;background:var(--panel);padding:6px 8px;overflow-wrap:anywhere;user-select:all}
.savebox .row{display:flex;flex-wrap:wrap;gap:8px}
.savebox a,.savebox button{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--exit);padding:5px 12px;text-decoration:none;cursor:pointer}
/* ---- the 2030 browser ---- */
#web{position:fixed;inset:0;z-index:7;background:#1d1e22;display:flex;flex-direction:column;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#202124;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#web .os{display:flex;justify-content:space-between;font-size:12px;color:#b9bbc2;padding:5px max(16px,env(safe-area-inset-left,0px));background:#121316}
#web .tabs{display:flex;padding:8px 12px 0;gap:4px;background:#2a2b30}
#web .tab{background:#f3f3f5;border-radius:8px 8px 0 0;padding:7px 14px;font-size:12px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#333}
#web .bar{background:#f3f3f5;padding:7px 12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #d8d8dc}
#web .nav{color:#9a9aa2;font-size:15px;letter-spacing:6px;flex:none}
#web form{flex:1;min-width:0}
#url{width:100%;box-sizing:border-box;border:0;border-radius:16px;background:#fff;padding:7px 14px;font:inherit;font-size:16px;color:#202124;outline:none;box-shadow:inset 0 0 0 1px #d0d0d6}
#url:focus{box-shadow:inset 0 0 0 2px #7a8aa8}
#pg{flex:1;min-height:0;overflow:auto;background:#fff;position:relative}
#pg .ghost{font-family:var(--mono);color:#8b8f97;font-size:14px;line-height:1.7;white-space:pre-wrap}
#pg .ghost input{font:inherit;border:0;border-bottom:1px solid #b9bcc4;outline:none;background:transparent;color:#4a4f58;width:16ch;font-size:16px}
#pg .ghost button{font:inherit;color:#5b6170;background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.p404{padding:24px max(16px,env(safe-area-inset-left,0px));font-family:"Times New Roman",Times,serif;color:#000}
.p404 h1{font-size:28px;margin:8px 0 12px;font-weight:700}
.p404 hr{border:0;border-top:1px solid #aaa}
.p404 .srv{text-align:center;font-size:15px;margin:6px 0 28px}
.snapbar{background:#2b2b2b;color:#ddd;font-family:var(--mono);font-size:12px;padding:8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.snapbar b{color:#fff;font-weight:400;letter-spacing:.1em}
.snapbar .years{display:flex;gap:3px;align-items:flex-end}
.snapbar .years i{display:block;width:14px;height:6px;background:#555}
.snapbar .years i.on{background:#e0473b;height:12px}
.snapbar .yl{color:#999;font-size:11px}
.oldpage{padding:28px max(16px,env(safe-area-inset-left,0px));font-family:"Times New Roman",Times,serif;color:#000;max-width:520px}
.broken{display:inline-flex;gap:6px;align-items:center;border:1px solid #c6c6c6;padding:4px 8px;font-size:13px;color:#555;margin-bottom:18px}
.broken svg{width:16px;height:16px}
.oldpage h2{font-size:24px;margin:0 0 4px}
.oldpage label{display:block;font-size:15px;margin:14px 0 4px}
.oldpage .fld{border:1px solid #888;padding:4px 6px;font-size:16px;background:#eee;color:#666;width:min(260px,100%);box-sizing:border-box;min-height:28px}
.oldpage .btn{margin-top:16px;font-family:inherit;font-size:16px;padding:3px 14px;border:1px solid #777;background:#e4e4e4;cursor:pointer;color:#000}
.oldpage a{color:#00e;margin-right:12px;font-size:14px}
.oldpage .note{color:#b00;font-size:15px;margin-top:14px;min-height:1.4em}
.oldpage .gone{color:#888;font-size:13px;margin-top:22px}
#web.tear{animation:tear 1.4s steps(9) forwards}
@keyframes tear{0%{clip-path:inset(0);filter:none}20%{clip-path:inset(10% 0 30% 0);transform:translateX(-12px);filter:hue-rotate(90deg) saturate(3)}
 40%{clip-path:inset(40% 0 5% 0);transform:translateX(18px)}60%{clip-path:inset(0 0 60% 0);transform:translateX(-6px);filter:invert(1)}
 80%{clip-path:inset(48% 0 48% 0);transform:none;filter:none}100%{clip-path:inset(50% 0 50% 0);opacity:0}}
@media (prefers-reduced-motion:reduce){#web.tear{animation:none;opacity:0}}
.sys{color:var(--dim);font-size:13px}
.frag{color:var(--exit);font-size:13px;letter-spacing:.04em}
.me{color:var(--dim)}
.me::before{content:"> "}
.end{text-align:center;color:var(--ink);letter-spacing:.2em;padding:2em 0}
.ob{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--dim);text-underline-offset:3px}
.ob:hover{color:#fff;text-decoration-color:var(--exit)}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
#chips button{font:inherit;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--faint);padding:4px 10px;cursor:pointer;min-height:32px}
#chips button.ex{border-color:#5b2a26;color:#f1c9c4}
#chips button.ex::before{content:"→ ";color:var(--exit)}
#chips button:hover{border-color:var(--dim)}
#form{display:flex;gap:10px;align-items:center;border-top:1px solid var(--faint);padding-top:10px}
#form label{color:var(--exit)}
#cmd{flex:1;min-width:0;font:inherit;font-size:16px;background:transparent;border:0;color:var(--ink);caret-color:var(--exit);outline:none}
#cmd::placeholder{color:var(--faint)}
button:focus-visible,#cmd:focus-visible{outline:1px solid var(--exit);outline-offset:2px}

#mapov{position:fixed;inset:0;background:rgba(8,10,9,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#mapov svg{width:min(100%,820px);height:auto;max-height:80%}
#mapov .hint{font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
#mapov rect.node{fill:var(--panel);stroke:var(--dim)}
#mapov rect.unk{fill:none;stroke:var(--faint);stroke-dasharray:3 3}
#mapov rect.here{fill:var(--exit);stroke:var(--exit)}
#mapov text{font-family:var(--mono);fill:var(--ink);font-size:9px;letter-spacing:.08em}
#mapov text.unk{fill:var(--dim)}
#mapov text.here{fill:#140806}
#mapov text.small{fill:var(--dim);font-size:7.5px}
#mapov text.red{fill:var(--exit);font-size:7.5px}
#mapov .e{stroke:var(--dim);stroke-width:1.5;fill:none}
#mapov .e.d{stroke-dasharray:4 4}
#mapov .e.w{stroke:var(--voice)}
#cover{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;z-index:6;text-align:center;padding:16px}
#cover .t{letter-spacing:.3em;font-size:13px}
#cover .s{color:var(--dim);font-size:12px}
#cover .k{color:var(--exit);font-size:12px;animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){#viewwrap{transition:none}#cover .k{animation:none}}
@media (max-width:760px){
  body{font-size:14px}
  #app{flex-direction:column;gap:10px}
  #app.open #viewwrap{flex-basis:38%}
  #term{max-width:none;width:100%}
}
</style>

<div id="app">
  <div id="viewwrap" aria-hidden="true">
    <div id="view"><pre id="ascii" hidden></pre><canvas id="pix" width="96" height="128" hidden></canvas><div id="gl" hidden></div></div>
    <div id="cap"></div>
  </div>
  <div id="term">
    <div id="bar"><span class="where" id="where">cca.edu (archived)</span><span id="fid">fidelity <b>TEXT</b></span><span id="mem">0/8</span>
      <button id="bmap" type="button">map</button><button id="bsnd" type="button">sound on</button></div>
    <div id="log"></div>
    <div id="chips"></div>
    <form id="form" autocomplete="off"><label for="cmd">&gt;</label><input id="cmd" placeholder="type here, or click" spellcheck="false" autocapitalize="off"></form>
  </div>
</div>
<div id="mapov" hidden><svg id="mapsvg" viewBox="0 0 420 300" role="img" aria-label="Map"></svg><div class="hint">fire exit plan · reconstructed · click or esc to close</div></div>
<div id="cover" hidden></div>
<div id="web">
  <div class="os"><span>Fri, Nov 8, 2030</span><span>11:47 PM</span></div>
  <div class="tabs"><div class="tab" id="tabt">New Tab</div></div>
  <div class="bar"><span class="nav" aria-hidden="true">‹ › ↻</span><form id="urlform" autocomplete="off"><input id="url" placeholder="cca.edu" spellcheck="false" autocapitalize="off" aria-label="Address"></form></div>
  <div id="pg"><div class="ghost" style="padding:24px 16px">type the old address and press enter</div></div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);

/* ============================================================
   SETTINGS
   ============================================================ */
const CLOSE_DATE=new Date('2027-05-31T00:00:00'); // ✎ the real date the Fluxus server goes offline
const THRESH=[2,4,6];                            // memories needed for ASCII, RASTER, DEPTH
const FID=['TEXT','ASCII','RASTER','DEPTH'];
const TOTAL=9;
const SITE_URL='';   // ✎ the published address of this game, for the Save Page Now ending (empty = this page's address)
const CAPTURE='May 30, 2027 · 23:58:12';

/* ============================================================
   STATE
   ============================================================ */
const KEY='afterschool-v1';
const fresh=()=>({name:'',room:'dorm',frags:[],stage:0,items:[],flags:{},visited:{},used:{},loops:0,waits:0,dark:0,ended:null,booted:false});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const has=i=>S.items.includes(i);
const got=f=>S.frags.includes(f);
const daysLeft=()=>Math.max(0,Math.ceil((CLOSE_DATE-new Date())/864e5));
const dateStr=()=>CLOSE_DATE.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});

/* ============================================================
   ROOMS
   Lines: "plain narration", {f:"FLUXUS speaks"}, {s:"system"}.
   [thing] in narration becomes a clickable word that examines it.
   {{wrong|right}} inside a FLUXUS line: types wrong, deletes, types right.
   ✎ marks text to replace with your own memory or research.
   ============================================================ */
const R={
dorm:{name:'Dorm Room',
  desc:()=>[`Your old dorm room, exactly the size you remember. The bed is made the way you never made it. On the desk your [laptop] is open, the CCA page still on the screen. Above it, the [corkboard]. Through the [window], a red light blinks somewhere over the city.\n\nThe door is open. Past it, the stairwell goes down.`],
  objs:{
    laptop:{n:['laptop','computer','screen','page'],t:()=>[`The page says: You are signed in as ${S.name}. Under it, in smaller letters: Last activity, May 30, 2027.`]},
    corkboard:{n:['corkboard','cork','board','pins','photos'],frag:['memory','The corkboard'],t:()=>[
      // ✎ DRAFT — replace with what was really pinned above your desk
      `Pinned up: a key card on a lanyard, a printed floor plan of the Main Hall with a route traced in pen, a sticky note that says "after crit → hall?"`,
      `You remember going out at two in the morning just to walk the hall, because it was the only place in the city that was quiet and still lit.`]},
    window:{n:['window','light','red','city'],t:()=>[`The red light blinks about once a second. You used to count it when you couldn't sleep.`]},
    bed:{n:['bed','pillow'],t:()=>[`You could lie down. You don't think it would help. If you want to come back here from anywhere, you can [wake up|wake].`]},
  },
  exits:()=>[{k:['down','d','stairs','out','door','stairwell'],l:'down the stairwell',to:async()=>{
    await out([S.visited.entrance?`You take the stairs down again. They end where they ended last time.`:`You take the stairs down. Four floors. Five. The dorm only had four.`,`At the bottom there is a door, and the door opens onto the side entrance of the Main Hall.`]);return 'entrance';}}]},
entrance:{name:'Side Entrance',
  desc:()=>[`The side door shuts behind you on its own. It is later than you meant to stay.\n\nOn the wall: a bronze [plaque], a [badge reader] blinking green, a clipboard with a [sign-in sheet]. Past them the floor runs on into a room too large to see the end of. The hall is north.`],
  objs:{
    plaque:{n:['plaque','bronze','wall'],frag:['history','The plaque'],t:()=>[
      `A small plaque that nobody reads.`,
      `BUILT 1951 FOR THE GREYHOUND CORPORATION AS A BUS MAINTENANCE FACILITY.\nSKIDMORE, OWINGS & MERRILL.\nRENOVATED FOR THE CALIFORNIA COLLEGE OF THE ARTS, 1998.`,
      `Under it, someone has scratched a third line with a key: CLOSED 2027.`]},
    badge:{n:['badge','reader','card'],t:()=>[`It blinks green whether you tap your card or not. It has been letting everyone in for a while now.`]},
    sheet:{n:['sheet','sign','clipboard','sign in'],t:()=>[`Every line has a name and a time in. Almost none of them have a time out.`,`The last line is ${S.name||'your name'}, in your handwriting. You don't remember signing it.`]},
  },
  exits:()=>[{k:['north','n','hall'],l:'north · the hall',to:'hall'},{k:['up','u','stairs','dorm','back'],l:'up the stairs · dorm',to:'dorm'}]},

hall:{name:'Main Hall',
  desc:()=>[`The hall is as long as a street and as quiet as one at four in the morning. White [pillars] lean in pairs, all toward the same side, holding up a ceiling you can't see the top of. Through the [skylights] comes a light that belongs to no particular hour. A [whiteboard] on wheels stands in the middle of nothing. Flat [carts] are parked wherever people let go of them.\n\nNorth, under a sign that says ID, are the studios. East, a red EXIT sign over a corridor. West, the floor runs on toward a red wall and darkness. South is the way you came in.`],
  objs:{
    whiteboard:{n:['whiteboard','board','white board'],frag:['memory','The whiteboard'],t:()=>[
      `Half-erased. Arrows, a floor plan of something, a phone number with the last digits wiped off, the word FINAL underlined three times.`,
      // ✎ DRAFT — replace with your own memory of the hall
      `You pinned your first project up out here, on a night like this one. Nobody came to look at it until morning. You stayed anyway, because the hall was the only place big enough to see it from far away.`]},
    pillars:{n:['pillar','pillars','column','columns'],t:()=>[`Steel, painted white, leaning. People say they lean a little further every year, and that when the school closes they will finally lie down.`]},
    skylights:{n:['skylight','skylights','ceiling','light'],t:()=>[`Orange from the streetlights or blue from the sky. It depends on when you look up, and you never catch it changing.`]},
    carts:{n:['cart','carts'],t:()=>[`Nobody returns them. Every studio has three that aren't theirs.`]},
  },
  exits:()=>[{k:['north','n','studios','id'],l:'north · studios',to:'junc'},{k:['east','e','exit','corridor'],l:'east · exit route',to:'exit'},
    {k:['west','w','red','dark'],l:'west · the red wall',to:'oldwing'},{k:['south','s','out','entrance'],l:'south · side entrance',to:'entrance'}]},

exit:{name:'Exit Route',
  desc:()=>{const L=[`A narrow corridor of [lockers] under caged work lamps, running east until it is too narrow to be a corridor. A slab of [concrete] cuts across it at an angle, as if the building had been poured around something else. Overhead, an [EXIT sign] points back the way you came.`];
    if(S.loops>=1&&!has('lamp'))L[0]+=`\n\nOne locker door hangs open.`;
    if(S.loops>=3)L[0]+=`\n\nAt the far end, where the corridor used to keep going, there is a [door].`;
    return L;},
  objs:{
    lockers:{n:['locker','lockers','open locker'],t:()=>S.loops>=1&&!has('lamp')
      ?[`Names on masking tape. One door hangs open, and inside is a caged [work lamp], still on.`]
      :[`Names on masking tape. Some are crossed out and written again in a different hand.`]},
    lamp:{n:['lamp','work lamp','light','cage'],hide:()=>S.loops<1||has('lamp'),take:true,t:()=>[`A caged work lamp on an orange cord that ends in nothing. It's on. You could [take it|lamp].`]},
    concrete:{n:['concrete','slab','wall','13'],frag:['myth','The slanted slab'],t:()=>[
      `Raw concrete, scarred, slanting up into the dark. Someone chalked a line up it and a number at the bottom: 13. A red plate at its foot says ROOF something. The rest is scraped away.`,
      // ✎ replace with real campus lore if you have it
      `Students say that if you count the slabs on the way in and again on the way out, there is always one more on the way out.`]},
    sign:{n:['exit sign','sign','exit','arrow'],t:()=>[`The arrow points west. No exit sign in this building has ever pointed the way you are going.`]},
    door:{n:['door'],hide:()=>S.loops<3,t:()=>[`A plain door with a push bar. Cold air comes under it.`]},
  },
  exits:()=>[{k:['west','w','hall','back'],l:'west · main hall',to:'hall'},
    {k:['east','e','door','on'],l:S.loops>=3?'east · the door':'east · keep walking',to:async()=>{
      if(S.loops>=3){await out([`You push the door. Cold air, the sound of 8th Street for one second, and then carpet, a fire door, your own corridor.`,`You are back at your dorm room door. You don't remember climbing any stairs.`]);S.used['exit>dorm']=1;return 'dorm';}
      S.loops++;
      if(S.loops===1)await out([`You walk east. Lockers. Lamps. Lockers. Lamps.`,`You are in the Exit Route. You are sure you were walking away from it.`,{f:`sorry. i never walked to the end of this one either.`}]);
      if(S.loops===2)await out([`You walk east for longer this time. You count the lamps. Forty. Forty-one. Forty-one.`]);
      if(S.loops===3)await out([`You run. The lamps go by like fence posts.`,`When you stop, there is something new at the end of the corridor.`]);
      return 'exit';}}]},

junc:{name:'Studios',
  desc:()=>{let t=`Two openings in a white wall, and big grey letters over them: N14 on the left, N16 on the right, and between them, smaller, ID. Through N14 you can see blue racks full of paintings. `;
    t+=S.flags.n16open?`The grey [curtain] across N16 has been pulled aside.`:`N16 is closed off by a grey [curtain] with a red STOP sign pinned to it.`;
    t+=` Two butcher-block [tables] are pushed against the wall.`;
    if(S.flags.n15)t+=`\n\nBetween the two openings, where there was only wall, there is a third. The letters over it say N15. They are the same grey as the others, almost.`;
    t+=`\n\nThe hall is back to the south.`;return [t];},
  objs:{
    curtain:{n:['curtain','stop','sign','n16 curtain'],t:()=>S.flags.n16open?[`The curtain is pulled to one side. N16 is empty.`]
      :[`CLASS IN PROGRESS. STOP. DO NOT ENTER.`,`Behind the curtain someone is presenting. You can hear the projector fan, but not the words.`]},
    tables:{n:['table','tables','butcher'],t:()=>[`Someone carved their initials into one of them, and a date: the first year the school was in this building.`]},
  },
  exits:()=>{const E=[{k:['west','w','n14','left'],l:'N14',to:'n14'}];
    if(S.flags.n15)E.push({k:['north','n','n15','middle'],l:'N15',to:'n15'});
    E.push({k:['east','e','n16','right'],l:'N16',to:async()=>{if(S.flags.n16open)return 'n16';
      await out([`The STOP sign is very clear about it.`]);
      if(!S.flags.waitHint){S.flags.waitHint=1;await out([{f:`classes always ran late here. just [wait].`}]);}return null;}});
    E.push({k:['south','s','hall','back'],l:'south · main hall',to:'hall'});return E;},
  wait:async()=>{if(S.flags.n16open)return false;S.waits++;
    if(S.waits===1)await out([`You wait. Someone laughs behind the curtain, and then everyone does.`]);
    else if(S.waits===2)await out([`You wait. Chairs scrape. Applause, a little too long.`]);
    else{S.flags.n16open=1;await out([`The voices stop all at once, in the middle of a word. The projector fan winds down.`,`The curtain moves, though nobody touched it. N16 is open.`]);}
    return true;}},

n14:{name:'N14',
  desc:()=>[`The studio is mostly racks: blue steel slots, floor to ceiling, full of [canvases] turned to face the wall. A [fire extinguisher]. A window onto the street, black. The room ends here. There is no other way out.`],
  first:[{f:`dead end. i remember that much.`}],
  objs:{
    canvases:{n:['canvas','canvases','painting','paintings','rack','racks'],frag:['memory','The canvases'],t:()=>[
      `You turn one around. It's unfinished: a hallway, painted in five different whites. On the back, a name you almost recognize, and a semester that ended years ago.`,
      // ✎ DRAFT — replace with your own memory of the racks
      `Nobody is coming back for these. They'll stay until someone is paid to throw them away.`]},
    extinguisher:{n:['extinguisher','fire'],t:()=>[`INSPECTED MONTHLY, says the tag. Every month is punched. So is next month.`]},
  },
  exits:()=>[{k:['east','e','back','out','studios'],l:'back · studios',to:'junc'}]},

n16:{name:'N16',
  desc:()=>[`The class is gone. Folding chairs in a half circle face a blank [wall], still warm from the projector. On one chair someone has left a [sketchbook].`],
  objs:{
    sketchbook:{n:['sketchbook','book','sketch','chair'],frag:['memory','The sketchbook'],t:()=>[
      // ✎ DRAFT — replace with a page from your own sketchbook
      `It's open to a floor plan of this building, drawn fast, from memory, a little wrong. The corridors are too long.`,
      `In the margin, in your handwriting: don't forget what it looked like at night.`]},
    wall:{n:['wall','projector','screen','shadow'],t:()=>[`Projector white. When you step in front of it, your shadow arrives a second late.`]},
  },
  exits:()=>[{k:['west','w','back','out','studios'],l:'back · studios',to:'junc'}]},

n15:{name:'N15',
  desc:()=>[`This room is the same size as N14 and the same color as N16. There are racks, but every [painting] faces out, and they are all the same painting. A [curtain] hangs on the inside of the door, so you are the one who is not supposed to come in.\n\nNorth, a doorway leads into N15.`],
  first:[{f:`i don't remember a fifteen. i think i made it up. there was a gap and it bothered me.`},{f:`is it close?`}],
  objs:{
    painting:{n:['painting','paintings','canvas','canvases','rack'],frag:['myth','N15'],t:()=>[
      `Each canvas is a painting of this room, from exactly where you are standing. In each one, the doorway behind you is a little smaller.`,
      `Every school has a room that isn't on the plans. This is this one's.`]},
    curtain:{n:['curtain','stop','sign'],t:()=>[`It's the same curtain. The STOP sign is pinned on backwards.`]},
  },
  exits:()=>[{k:['north','n','doorway','n15'],l:'north · N15',to:async()=>{await out([`You go north, into N15.`]);
      if(!S.flags.n15loop){S.flags.n15loop=1;await out([{f:`sorry. still working on it.`}]);}return 'n15';}},
    {k:['south','s','back','out','studios'],l:'back · studios',to:'junc'}]},

oldwing:{name:'Old Wing',dark:()=>!has('lamp'),
  desc:()=>has('lamp')
    ?[`Your lamp finds the [trusses] overhead: old timber, bolted and braced, older than anything else you've seen tonight. The red [tarp] runs alongside, and at the height of a hand it is torn. Far ahead, the white square of light.`]
    :[`The hall narrows into a tunnel under a pitched wooden roof. On the right a red [tarp] runs the whole length, taller than anything else here. Far ahead, at the very end, there is a white square of light. Between you and it is nothing you can see.`],
  objs:{
    tarp:{n:['tarp','red','wall','vinyl','tear'],t:()=>has('lamp')
      ?[`It's torn at the height of a hand, as if people have been going through it for years. You could [go through|through].`]
      :[`Red vinyl, heavy, stretched on steel pipe. On the other side something large is breathing, slow, like an engine idling.`]},
    trusses:{n:['truss','trusses','roof','beams','timber','ceiling'],frag:['history','The trusses'],t:()=>has('lamp')?[
      // ✎ check the CCA archives for the history of this wing before keeping this
      `Timber trusses, grey with dust, bolted where steel would be welded now. They were here before the school. Maybe before the buses.`]
      :[`You can't see the ceiling. You can't see your hands.`],nofrag:()=>!has('lamp')},
  },
  exits:()=>{const E=[{k:['west','w','light','end','forward'],l:'west · toward the light',to:async()=>{
      if(!has('lamp')){S.dark++;await out([S.dark===1?`You walk toward the light for a long time. When you look back, the hall is right behind you. The light is no closer.`:`You try again. The light stays exactly as far away.`]);
        if(S.dark===1)await out([{f:`too dark. i can't remember what neither of us could see.`}]);return null;}
      await out([`You walk toward the light. It turns out to be the far end of the Main Hall, the end nobody uses.`]);S.used['oldwing>hall']=1;return 'hall';}}];
    if(has('lamp'))E.push({k:['through','tarp','tear','north','n'],l:'through the tarp',to:'bay'});
    else E.push({k:['through','tarp','tear','north','n'],l:'the tarp',hide:true,to:async()=>{await out([`You can't find a way through.`]);return null;}});
    E.push({k:['east','e','back','hall'],l:'east · main hall',to:'hall'});return E;}},

bay:{name:'Behind the Tarp',
  desc:()=>[`Behind the tarp is a room the size of one bus. The concrete floor is stained in two long dark [tracks], parallel, where wheels stood for years. On the far wall, a stenciled [number]. In the corner, metal [stairs] go down.`],
  objs:{
    tracks:{n:['track','tracks','stain','stains','floor','oil'],frag:['history','The oil tracks'],t:()=>[
      `Oil, decades of it, soaked too deep to clean.`,

const log=$('log');

function parseRich(str){
  const segs=[];const re=/\[([^\]|]+)(?:\|([^\]]+))?\]|\{\{([^|}]+)\|([^}]+)\}\}/g;let i=0,m;
  while((m=re.exec(str))){if(m.index>i)segs.push({t:'x',s:str.slice(i,m.index)});
    if(m[1])segs.push({t:'o',s:m[1],tgt:m[2]||m[1]});else segs.push({t:'w',s:m[3],r:m[4]});i=re.lastIndex;}
  if(i<str.length)segs.push({t:'x',s:str.slice(i)});return segs;
}
async function type(el,str,speed){
  const segs=parseRich(str);
  for(const sg of segs){
    let node;
    if(sg.t==='o'){node=document.createElement('button');node.type='button';node.className='ob';node.dataset.cmd=sg.tgt;el.appendChild(node);}
    else{node=document.createTextNode('');el.appendChild(node);}
    const s=sg.t==='w'?sg.s:sg.s;
    await typeInto(node,s,speed);
    if(sg.t==='w'){await sleep(420);for(let k=s.length;k>0;k--){node.textContent=s.slice(0,k-1);if(!skipping)await sleep(45);}await sleep(200);await typeInto(node,sg.r,speed);}
  }
}
async function typeInto(node,s,speed){
  if(skipping||speed===0){node.textContent+=s;scroll();return;}
  for(let i=0;i<s.length;i+=speed){
    node.textContent+=s.slice(i,i+speed);if(i%6===0)tick();scroll();
    await new Promise(r=>setTimeout(r,16));if(skipping){node.textContent+=s.slice(i+speed);scroll();return;}
    if(/[.?!]/.test(s[i+speed-1])&&s[i+speed]===' ')await sleep(140);
  }
}
const scroll=()=>{log.scrollTop=log.scrollHeight;};
function glitch(str){ // FLUXUS slips a little more at higher fidelity
  if(S.stage<2||Math.random()>.35)return str;
  const w=str.split(' ');const i=Math.floor(Math.random()*w.length);
  if(w[i].length<5||/[\[\]{}]/.test(w[i]))return str;
  const bad=w[i].slice(0,-2)+w[i].slice(-1)+w[i].slice(-2,-1);
  w[i]=`{{${bad}|${w[i]}}}`;return w.join(' ');
}
async function out(lines){
  for(const L of lines){
    const d=document.createElement('div');log.appendChild(d);
    if(typeof L==='string'){await type(d,L,3);}
    else if(L.f){d.className='fx';await type(d,glitch(L.f),1);await sleep(260);}
    else if(L.s){d.className='sys';await type(d,L.s,4);}
    else if(L.g){d.className='frag';await type(d,L.g,2);}
    else if(L.r){d.className='room';await type(d,L.r,1);}

let T3=null;

function ensure3(){
  if(T3)return Promise.resolve(true);if(p3)return p3;
  return p3=

    const go=()=>{try{init3();res(true);}catch(e){res(false);}};
    if(window.THREE)return go();
    const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';

    await out([{f:`okay.`}]);await sleep(900);
    S.room='hall';hud();await showView('hall',false);
    if(S.stage>=3){await out([{f:`depth goes first.`}]);if(T3){T3.decay=.4;await sleep(1400);T3.decay=1.6;}await sleep(1600);sweep(false);S.stage=2;await showView('hall',false);}
    if(S.stage>=2){await out([{f:`then color.`}]);await sleep(1400);sweep(false);S.stage=1;await showView('hall',false);}
    if(S.stage>=1){await out([{f:`then the shape.`}]);await sleep(1600);sweep(false);S.stage=0;await showView('hall',false);}
    hud();setHum();await sleep(1800);
    await out([{f:`then me.`}]);await sleep(1600);
    await show404(true);
  }
  save();
}

const UNKNOWN=[`i don't think we ever did that here.`,`hm. say it another way? try [help].`,`no. i don't remember that.`];
let unk=0,restartArm=false,idleSaid=false,lastInput=Date.now();
const DIR={n:'north',s:'south',e:'east',w:'west',u:'up',d:'down'};
const STOP=new Set(['the','a','an','at','to','into','in','on','with','go','walk','enter','run']);
async function handle(raw){
  const c=raw.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();if(!c)return;
  const w=c.split(' '),v=w[0],rest=w.slice(1).filter(x=>!STOP.has(x)).join(' ');
  if(v==='restart'){if(restartArm){try{localStorage.removeItem(KEY);}catch(e){}location.reload();return;}
    restartArm=true;return out([{s:`Type restart again to forget everything and start over.`}]);}
  restartArm=false;
  if(S.ended)return out([S.ended==='keep'?`The hall is quiet. The page is still up, for now. (restart to begin again)`:`There is nothing here now. (restart to begin again)`]);
  if(S.room==='server'&&(c==='keep'||c==='keep it'))return ending('keep');
  if(S.room==='server'&&/^let( it)? go|^delete|^erase/.test(c))return ending('go');
  if(['help','h','?','commands'].includes(v))return out([{s:`look · north / south / east / west · examine [thing] · take [thing] · wait · map · memories · restart\nYou can also click underlined words and the exits under the text.`}]);
  if(['map','m'].includes(v))return toggleMap(true);
  if(['look','l'].includes(v)&&!rest)return out([{r:R[S.room].name},...R[S.room].desc()]);
  if(['memories','memory','remember','fragments','inventory','i','inv'].includes(v)){
    const L=S.frags.length?S.frags.map(f=>{const [k,r]=f.split('@');const o=R[r].objs[k];return `◆ ${o.frag[0].padEnd(8)} ${o.frag[1]} · ${R[r].name}`;}).join('\n'):'nothing yet';
    return out([{s:`memories ${S.frags.length}/${TOTAL}\n${L}`+(S.items.length?`\ncarrying: work lamp`:'')}]);}
  if(['wait','z','listen','stay','sit'].includes(v)){const h=R[S.room].wait;if(h&&await h())return;return out([`You wait. Nothing happens, and keeps happening.`]);}
  if(['hello','hi','hey','who','talk','friend','name'].includes(v))return out([{f:[`it's me. you don't remember, do you. that's okay.`,`we used to stay here until they turned the lights off.`,`you're remembering it better than me now.`,`...`][S.stage]}]);
  if(['sleep','wake','pinch','logout'].includes(v)||c==='wake up'||c==='log out'){if(S.room==='dorm')return out([`You're already in your room.`]);await out([`You pinch the back of your hand. The room flickers like a page reloading.`]);return enter('dorm');}
  if(['take','get','grab','pick'].includes(v))return take(rest.replace(/^up /,''));
  if(['x','examine','inspect','read','check','touch','open','search','turn','look','l'].includes(v))return examine(rest.replace(/^(at|behind|under) /,''));
  if(['go','walk','enter','run','climb','through'].includes(v)&&rest){return move(findExit(DIR[rest]||rest)||findExit(rest.split(' ').pop()));}
  const dir=DIR[c]||c;const ex=findExit(dir);if(ex)return move(ex);
  if(findObj(c))return examine(c);
  return out([{f:UNKNOWN[unk++%UNKNOWN.length]}]);
}

const cmd=$('cmd');
function chips(){
  const box=$('chips');box.innerHTML='';
  const add=(label,run,cls)=>{const b=document.createElement('button');b.type='button';b.textContent=label;if(cls)b.className=cls;b.addEventListener('click',()=>submit(run));box.appendChild(b);};
  if(!S.booted)return;
  if(S.ended){add('restart','restart');return;}
  if(S.room==='server'){add('keep it','keep','ex');add('let it go','let it go','ex');}
  for(const e of R[S.room].exits())if(!e.hide)add(e.l,'go '+e.k[0],'ex');
  add('look','look');add('wait','wait');add('memories','memories');add('map','map');if(S.room!=='dorm')add('wake up','wake');
}
let asking=null;const queue=[];
async function submit(text){
  lastInput=Date.now();
  if(busy){if(text.trim())queue.push(text);skipping=true;return;}
  if(asking){const r=asking;asking=null;r(text);return;}
  if(!text.trim())return;
  busy=true;skipping=false;echo(text.trim());
  try{await handle(text);}catch(e){console.error(e);}
  save();hud();chips();busy=false;skipping=false;
  if(queue.length)setTimeout(()=>submit(queue.shift()),0);
}
$('form').addEventListener('submit',e=>{e.preventDefault();const v=cmd.value;cmd.value='';submit(v);});
log.addEventListener('click',e=>{const b=e.target.closest('.ob');if(b){const t=b.dataset.cmd;
  submit(['keep','let it go','wait','help','lamp','through','wake'].includes(t)?({lamp:'take lamp',through:'go through'}[t]||t):'examine '+t);return;}
  if(busy)skipping=true;});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('mapov').hidden){toggleMap(false);return;}
  if(document.activeElement!==cmd&&e.key.length===1&&!e.metaKey&&!e.ctrlKey&&$('web').hidden)cmd.focus();});
setInterval(()=>{ // the friend notices when you stop moving
  if(busy||S.ended||!S.booted||S.stage<1||idleSaid||Date.now()-lastInput<75000)return;idleSaid=true;
  busy=true;out([{f:`${S.name}? you still there?`}]).then(()=>{busy=false;});},5000);

const pg=$('pg'),web=$('web'),urlI=$('url');
function ghostLine(parent,text){return new Promise(async res=>{const d=document.createElement('div');d.className='ghost';parent.appendChild(d);
  for(let i=0;i<text.length;i++){d.textContent+=text[i];if(i%3===0)tick();await new Promise(r=>setTimeout(r,skipping?0:42));}res(d);});}
const BROKEN=`<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" fill="none" stroke="#999"/><path d="M3 12l3-4 2 2 2-3 3 5z" fill="#bbb"/><path d="M9 1.5l-2 4 3 1-2 4" fill="none" stroke="#c33"/></svg>`;

    web.hidden=false;web.classList.remove('tear');$('tabt').textContent='404 Not Found';urlI.readOnly=true;
    pg.innerHTML=`<div class="p404"><h1>404 Not Found</h1><hr><div class="srv">nginx</div><div id="gh"></div></div>`;
    const gh=$('gh');

      const w=document.createElement('div');w.className='ghost';w.appendChild(b);gh.appendChild(w);
      b.addEventListener('click',()=>{try{localStorage.removeItem(KEY);}catch(e){}location.reload();});}
    res(gh);});
}

  <h2>Student Portal</h2><div>Sign in to continue.</div>

  <div><a>Forgot password?</a><a>Help</a></div>
  <div class="gone">Some images and styles on this page were not archived.</div></div>`;
  $('un').textContent=S.name;
}
async function opening(){
  busy=true;
  if(S.booted){ // returning visitor: straight to the last copy
    urlI.value='cca.edu';oldPortal();
    await new Promise(r=>$('signin').addEventListener('click',r,{once:true}));initAudio();
    $('note').textContent=S.ended?'':`Welcome back.`;await sleep(900);await tearIn();
    if(S.ended){await out([{f:S.ended==='keep'?`you came back. it's all still here.`:`there's nothing left here, ${S.name}.`}]);if(S.ended==='keep')await showView('hall',false);}
    else{await out([{f:`you're back. i kept your place.`}]);await enter(S.room);}
  }else{
    urlI.focus();
    await new Promise(r=>$('urlform').addEventListener('submit',e=>{e.preventDefault();r();},{once:true}));
    initAudio();if(!urlI.value.trim())urlI.value='cca.edu';urlI.blur();
    $('tabt').textContent='Loading…';pg.innerHTML='';await sleep(1100);
    const gh=await show404(false);
    await sleep(1800);await ghostLine(gh,`are you looking for someone?`);await sleep(900);
    const ask=await ghostLine(gh,`who are you? `);
    const inp=document.createElement('input');inp.setAttribute('aria-label','your name');inp.maxLength=24;ask.appendChild(inp);inp.focus();
    const name=await new Promise(r=>inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim()){e.preventDefault();r(inp.value.trim());}}));
    inp.disabled=true;S.name=name.slice(0,24);
    await sleep(500);await ghostLine(gh,`oh.`);await sleep(700);await ghostLine(gh,`it's you. it's been a while.`);await sleep(600);
    const w=await ghostLine(gh,`the last copy is still here. `);
    const go=document.createElement('button');go.type='button';go.textContent='open it';w.appendChild(go);go.focus();
    await new Promise(r=>go.addEventListener('click',r,{once:true}));
    oldPortal();
    await new Promise(r=>$('signin').addEventListener('click',r,{once:true}));
    const note=$('note');note.textContent='This account was deactivated on May 31, 2027.';await sleep(1800);
    note.textContent+='\n';const g2=document.createElement('div');g2.className='ghost';note.appendChild(g2);
    for(const ch of '...but someone is still signed in.'){g2.textContent+=ch;await sleep(55);}
    await sleep(1200);await tearIn();
    await out([{f:`hey. it's me.`},{f:`you don't remember me. that's okay. i don't remember much either.`},{f:`walk around with me? look at things. maybe we'll both remember.`},{s:`Type, or click underlined words and the exits under the text. help lists commands.`}]);
    S.booted=true;S.visited={};await enter('dorm');
  }
  save();hud();chips();busy=false;skipping=false;cmd.focus();
  if(queue.length)setTimeout(()=>submit(queue.shift()),0);
}
async function tearIn(){sweep(false);web.classList.add('tear');await sleep(1400);web.hidden=true;web.classList.remove('tear');cmd.focus();}
web.addEventListener('click',()=>{if(busy)skipping=false;});
opening();
hud();
})();
