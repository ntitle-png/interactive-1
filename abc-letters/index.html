<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>A B C - CSS 字母</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>用 CSS 拼 A / B / C</h1>
<p>每个字母都是一个独立的 <code>&lt;div class="letter-frame"&gt;</code>，里面用几个矩形/圆形拼出来。想改哪个字母，就去 style.css 里找对应的注释段落。</p>

<div class="gallery">

  <!-- 字母 A：两条斜着的矩形腿 + 一条横杠 -->
  <figure class="card">
    <div class="letter-frame">
      <div class="a-leg-left"></div>
      <div class="a-leg-right"></div>
      <div class="a-bar"></div>
    </div>
    <figcaption>A</figcaption>
  </figure>

  <!-- 字母 B：一条竖脊 + 两个圆角凸起（凸起中间挖了个"洞"） -->
  <figure class="card">
    <div class="letter-frame">
      <div class="b-spine"></div>
      <div class="b-bump-top"></div>
      <div class="b-bump-top-hole"></div>
      <div class="b-bump-bottom"></div>
      <div class="b-bump-bottom-hole"></div>
    </div>
    <figcaption>B</figcaption>
  </figure>

  <!-- 字母 C：一个圆环（大圆 + 挖掉中间小圆）+ 挖开右边一个缺口 -->
  <figure class="card">
    <div class="letter-frame">
      <div class="c-ring"></div>
      <div class="c-ring-hole"></div>
      <div class="c-opening"></div>
    </div>
    <figcaption>C</figcaption>
  </figure>

</div>

</body>
</html>
