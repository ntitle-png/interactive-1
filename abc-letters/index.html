<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CSS Letters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="gallery">

  <figure class="card">
    <div class="letter-frame">
      <div class="a-leg-left"></div>
      <div class="a-leg-right-shell">
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
      </div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="b-spine"></div>
      <div class="b-circle-top"></div>
      <div class="b-circle-top-hole"></div>
      <div class="b-circle-bottom"></div>
      <div class="b-circle-bottom-hole"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="c-frame">
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
      </div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="a-bowl"></div>
      <div class="a-stem"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="b-stem"></div>
      <div class="b-bowl"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="c-dot-s"></div>
      <div class="c-dot-s"></div>
      <div class="c-dot-s"></div>
      <div class="c-dot-s"></div>
      <div class="c-dot-s"></div>
      <div class="c-dot-s"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="o-upper-spin">
        <div class="o-ring o-ring-outer-upper"></div>
        <div class="o-ring o-ring-inner-upper"></div>
      </div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="o-ring o-ring-outer-lower"></div>
      <div class="o-ring o-ring-inner-lower"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="t-upper-bounce">
        <div class="t-spike-upper"></div>
        <div class="t-wing-left-upper"></div>
        <div class="t-wing-right-upper"></div>
      </div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="t-wing-left-lower"></div>
      <div class="t-wing-right-lower"></div>
      <div class="t-dot-lower"></div>
      <div class="t-dot-lower"></div>
      <div class="t-dot-lower"></div>
      <div class="t-dot-lower"></div>
      <div class="t-dot-lower"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
      <div class="u-dot upper"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
      <div class="u-dot lower"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="v-upper-bounce">
        <div class="v-middle-upper"></div>
        <div class="v-leg-shell-upper left">
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
        </div>
        <div class="v-leg-shell-upper right">
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
          <div class="v-tri"></div>
        </div>
      </div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="v-tri-lower left"></div>
      <div class="v-tri-lower right"></div>
      <div class="v-tip-lower"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="z-top-upper"></div>
      <div class="z-bottom-upper"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="z-top-lower"></div>
      <div class="z-bottom-lower"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="d-shape"></div>
      <div class="d-hole"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="l-stem"></div>
      <div class="l-foot"></div>
      <div class="l-foot"></div>
    </div>
  </figure>

  <figure class="card">
    <div class="letter-frame">
      <div class="y-fork"></div>
      <div class="y-notch"></div>
      <div class="y-stem"></div>
      <div class="y-foot"></div>
    </div>
  </figure>

</div>

</body>
</html>
