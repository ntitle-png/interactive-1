<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>CSS Letters</title>
<link rel="stylesheet" href="style.css">
</head>
<body>


<div class="gallery">

  <!-- 字母 A：左腿是实心斜腿，右腿改成一串小三角形，横杠改成 5 条细线 -->
  <figure class="card">
    <div class="letter-frame">
      <div class="a-leg-left"></div>

      <!-- 右腿的外壳负责位置和旋转，里面 6 个三角形负责"画满" -->
      <div class="a-leg-right-shell">
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
        <div class="a-tri"></div>
      </div>

      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
      <div class="a-bar-line"></div>
    </div>
    <figcaption>A</figcaption>
  </figure>

  <!-- 字母 B：胶囊形竖杆 + 上下两个正圆，圆心里再挖一个同心小圆当镂空 -->
  <figure class="card">
    <div class="letter-frame">
      <div class="b-spine"></div>
      <div class="b-circle-top"></div>
      <div class="b-circle-top-hole"></div>
      <div class="b-circle-bottom"></div>
      <div class="b-circle-bottom-hole"></div>
    </div>
    <figcaption>B</figcaption>
  </figure>

  <!-- 字母 C：8 个从大到小排列的圆点，沿一个假想圆环摆出 C 的形状 -->
  <figure class="card">
    <div class="letter-frame">
      <div class="c-frame">
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
        <div class="c-dot"></div>
      </div>
    </div>
    <figcaption>C</figcaption>
  </figure>

</div>

</body>
</html>
