<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YIPPEE!!!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <button class="letter" style="--bw:6em">
    <span class="glyph">
      <span class="p torso" style="--x:2;--y:4.2;--w:2;--h:4.3"></span>
      <span class="p arm" style="--x:1.65;--y:1;--w:1.5;--h:4;--r:-24deg"></span>
      <span class="p arm" style="--x:2.85;--y:1;--w:1.5;--h:4;--r:24deg"></span>
      <span class="p head" style="--x:2.1;--y:2.8;--w:1.8;--h:1.8"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

  <button class="letter" style="--bw:4em">
    <span class="glyph">
      <span class="p torso" style="--x:1;--y:2;--w:2;--h:6.5"></span>
      <span class="p head" style="--x:1.1;--y:0.4;--w:1.8;--h:1.8"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

  <button class="letter" style="--bw:5.4em">
    <span class="glyph">
      <span class="p arc" style="--x:1.4;--y:2;--w:3.8;--h:4.4"><span class="hole"></span></span>
      <span class="p torso" style="--x:0.4;--y:2;--w:2;--h:6.5"></span>
      <span class="p head" style="--x:0.5;--y:0.4;--w:1.8;--h:1.8"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

  <button class="letter" style="--bw:5.4em">
    <span class="glyph">
      <span class="p arc" style="--x:1.4;--y:2;--w:3.8;--h:4.4"><span class="hole"></span></span>
      <span class="p torso" style="--x:0.4;--y:2;--w:2;--h:6.5"></span>
      <span class="p head" style="--x:0.5;--y:0.4;--w:1.8;--h:1.8"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

  <button class="letter" style="--bw:5.8em">
    <span class="glyph">
      <span class="p torso" style="--x:0.4;--y:2;--w:2;--h:6.5"></span>
      <span class="p head" style="--x:0.5;--y:0.4;--w:1.8;--h:1.8"></span>
      <span class="p arm" style="--x:1.6;--y:2.2;--w:3.9;--h:1.45"></span>
      <span class="p arm" style="--x:1.7;--y:4.6;--w:3.2;--h:1.35"></span>
      <span class="p arm" style="--x:1.2;--y:7.05;--w:4.4;--h:1.45"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

  <button class="letter" style="--bw:5.8em">
    <span class="glyph">
      <span class="p torso" style="--x:0.4;--y:2;--w:2;--h:6.5"></span>
      <span class="p head" style="--x:0.5;--y:0.4;--w:1.8;--h:1.8"></span>
      <span class="p arm" style="--x:1.6;--y:2.2;--w:3.9;--h:1.45"></span>
      <span class="p arm" style="--x:1.7;--y:4.6;--w:3.2;--h:1.35"></span>
      <span class="p arm" style="--x:1.2;--y:7.05;--w:4.4;--h:1.45"></span>
    </span>
    <img class="pose sit" src="crouch.png" alt="">
    <img class="pose up" src="jump.png" alt="">
  </button>

</div>

<div class="controls">
  <button class="btn primary" id="soundBtn">START PARTY!!!</button>
  <button class="btn" id="waveBtn">ALL PARTYING!!!!1!</button></div>

<script src="script.js"></script>
</body>
</html>
